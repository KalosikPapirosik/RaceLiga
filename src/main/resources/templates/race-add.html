<!DOCTYPE html>
<html lang="ru", xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main>
  <form class="stack"
        th:action="${editing}
          ? @{/races/{raceName}(raceName=${originalName})}
          : @{/races}"
        method="post"
        th:object="${raceSessionModel}"
        novalidate>

    <div role="alert" th:if="${#fields.hasAnyErrors()}">
      Исправьте отмеченные поля.
    </div>

    <label for="name">Название
      <input id="name" type="text" th:field="*{name}" maxlength="100"
             th:attr="aria-invalid=${#fields.hasErrors('name')}">
      <span id="name-error"
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}">Ошибка названия</span>
    </label>

    <label for="track">Трэк
      <input id="track" type="text" th:field="*{track}" maxlength="100">
      <span th:if="${#fields.hasErrors('track')}"
            th:errors="*{track}">Ошибка трэка</span>
    </label>

    <label for="description">Описание
      <textarea id="description" rows="6"
                th:field="*{description}" maxlength="2000"></textarea>
      <span th:if="${#fields.hasErrors('description')}"
            th:errors="*{description}">Ошибка описания</span>
    </label>

    <label for="prize">Призовой фонд
      <input id="prize" type="number" min="0.01" step="0.01"
             th:field="*{prize}">
      <span th:if="${#fields.hasErrors('prize')}"
            th:errors="*{prize}">Ошибка призового фонда</span>
    </label>

    <button type="submit" th:text="${submitLabel}">Сохранить</button>
  </form>

</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
